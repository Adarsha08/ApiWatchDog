services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: watchdog
      POSTGRES_PASSWORD: watchdog_pass
      POSTGRES_DB: watchdog_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchdog -d watchdog_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://watchdog:watchdog_pass@db:5432/watchdog_dev?schema=public
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: